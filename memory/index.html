<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Memory</title>
    <link href="./index.css" rel="stylesheet" type="text/css" />
</head>

<body>

<div class="wrapper-horizontal">
    <div id="config" class="wrapper-vertical">
        <div id="config-setup" class="wrapper-vertical">
            <table id="config-controls">
                <tbody>
                    <tr>
                        <td>Players</td>
                        <td>
                            <select id="config-player-count">
                                <option value="1" selected>one</option>
                                <option value="2">two</option>
                                <option value="3">three</option>
                                <option value="4">four</option>
                                <option value="5">five</option>
                                <option value="6">six</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Size</td>
                        <td>
                            <select id="config-size">
                                <option value="small">small</option>
                                <option value="medium" selected>medium</option>
                                <option value="large">large</option>
                                <option value="xl">extra large</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Difficulty</td>
                        <td>
                            <select id="config-match-size">
                                <option value="2" selected>normal</option>
                                <option value="3">hard</option>
                                <option value="4">very hard</option>
                                <option value="5">very very hard</option>
                                <option value="6">very very very hard</option>
                                <option value="7">very x 4 hard</option>
                                <option value="8">very x 5 hard</option>
                                <option value="9">very x 6 hard</option>
                                <option value="10">very x 7 hard</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Theme</td>
                        <td>
                            <select id="config-theme">
                                <option value="food">food</option>
                                <option value="animals">animals</option>
                                <option value="food and animals" selected>food and animals</option>
                                <option value="flags">flags</option>
                                <option value="mixed">mixed</option>
                                <option value="playing cards">playing cards</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td id="config-submit" colspan="2">
                            <button id="config-start">Start</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="game-score" class="wrapper-vertical">
            <table id="game-player">
                <tbody id="game-player-tbody"></tbody>
            </table>
            <div id="game-turns"></div>
        </div>

        <button id="game-restart">Restart</button>
    </div>

    <table id="game-board">
        <tbody id="game-board-tbody"></tbody>
    </table>
</div>


<script src="./characters.js"></script>
<script src="./index.js"></script>

</body>
</html>
